<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wired Button Test</title>
  <script type="module" src="https://unpkg.com/wired-elements?module"></script>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Patrick Hand', cursive;
      font-size: 18px;
      background-image: radial-gradient(#d7d7d7 1px, transparent 1px);
      background-size: 20px 20px;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    label {
      width: 320px;
      color: #555;
      font-size: 14px;
    }

    /* Option A: plain button with sketchy border trick */
    .btn-primary {
      background: #333; color: white;
      border: 2px solid #333;
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      font-family: 'Patrick Hand', cursive; font-size: 18px;
      padding: 12px 28px; cursor: pointer;
    }
    .btn-secondary {
      background: white; color: #333;
      border: 2px solid #333;
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      font-family: 'Patrick Hand', cursive; font-size: 18px;
      padding: 12px 28px; cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Option A — Plain &lt;button&gt; with sketchy border trick</h2>
  <div class="row">
    <label>Primary (.btn-primary)</label>
    <button class="btn-primary">Get Started</button>
  </div>
  <div class="row">
    <label>Secondary (.btn-secondary)</label>
    <button class="btn-secondary">Learn More</button>
  </div>

  <hr style="border: 1px dashed #999; margin: 20px 0;">

  <h2>Option B — &lt;wired-button fill="#333" color="white"&gt;</h2>
  <div class="row">
    <label>Primary (fill="#333" style="color:white")</label>
    <wired-button fill="#333" style="color: white;">Get Started</wired-button>
  </div>
  <div class="row">
    <label>Secondary (default wired-button)</label>
    <wired-button>Learn More</wired-button>
  </div>

  <hr style="border: 1px dashed #999; margin: 20px 0;">

  <h2>Known bad pattern (for reference)</h2>
  <div class="row">
    <label>❌ color:white, no fill (invisible bug)</label>
    <wired-button style="color: white;">Invisible</wired-button>
  </div>

</body>
</html>
